# ── Polaris — DEV overlay ────────────────────────────
# Adds a local MySQL container and repoints backend/worker/watcher at it, so a
# developer machine needs no production database. Apply ON TOP of the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# MYSQL_DATABASE (default: polaris) picks the schema inside the local MySQL,
# so a seeded demo database (see scripts/seed_demo.py) can live beside the
# dev one:  MYSQL_DATABASE=polaris_demo docker compose -f ... up -d
#
# The base docker-compose.yml alone is PRODUCTION (uses POLARIS_DATABASE_URL from .env).
# ──────────────────────────────────────────────────────────

services:
  # ── Local MySQL (dev only) ──
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-polaris}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-polaris}
      MYSQL_USER: ${MYSQL_USER:-polaris}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-polaris}
    ports:
      # Exposed so you can inspect the dev DB from the host (e.g. a SQL client).
      # Host side is 3307 because a native Windows MySQL service holds 3306.
      # Only affects host access -- the app containers reach MySQL at mysql:3306
      # over the compose network regardless.
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Point the app at the local MySQL and wait for it to be healthy. These
  # POLARIS_DATABASE_URL values override the base file's production value.
  backend:
    environment:
      POLARIS_DATABASE_URL: mysql+pymysql://polaris:${MYSQL_PASSWORD:-polaris}@mysql:3306/${MYSQL_DATABASE:-polaris}
    volumes:
      # Replace the production /mnt/c bind by destination when Compose merges
      # this overlay. Docker Desktop then receives a native Windows host path.
      - ${POLARIS_HOST_DATA_DIR:-C:\Polaris}/Invoices:/data/Invoices
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    environment:
      POLARIS_DATABASE_URL: mysql+pymysql://polaris:${MYSQL_PASSWORD:-polaris}@mysql:3306/${MYSQL_DATABASE:-polaris}
    volumes:
      - ${POLARIS_HOST_DATA_DIR:-C:\Polaris}/Invoices:/data/Invoices
    depends_on:
      mysql:
        condition: service_healthy

  watcher:
    environment:
      POLARIS_DATABASE_URL: mysql+pymysql://polaris:${MYSQL_PASSWORD:-polaris}@mysql:3306/${MYSQL_DATABASE:-polaris}
    volumes:
      - ${POLARIS_HOST_DATA_DIR:-C:\Polaris}/Invoices:/data/Invoices
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
