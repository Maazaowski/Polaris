# Manual-only: re-author the golden-corpus models with a real AI key and hand
# back the model.json snapshots as an artifact for review + commit. Never runs
# on a schedule; there is no nightly AI spend.
#
# Runs scripts/refresh_authoring_snapshots.py with the key from the chosen
# provider's repository secret (POLARIS_OPENAI_API_KEY or
# POLARIS_ANTHROPIC_API_KEY) and a throwaway SQLite registry.
name: Authoring (manual)

on:
  workflow_dispatch:
    inputs:
      layout:
        description: Corpus layout to re-author
        type: choice
        default: all
        options:
          - all
          - colt.standard
          - eunetworks.standard
      provider:
        description: AI provider that authors the models
        type: choice
        default: openai
        options:
          - openai
          - anthropic

jobs:
  authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Author corpus models
        env:
          POLARIS_LLM_PROVIDER: ${{ inputs.provider }}
          POLARIS_OPENAI_API_KEY: ${{ secrets.POLARIS_OPENAI_API_KEY }}
          POLARIS_ANTHROPIC_API_KEY: ${{ secrets.POLARIS_ANTHROPIC_API_KEY }}
          LAYOUT: ${{ inputs.layout }}
        run: |
          args=(--scratch-db --work-dir "$RUNNER_TEMP/polaris-authoring")
          if [ "$LAYOUT" != "all" ]; then
            args+=(--only "$LAYOUT")
          fi
          python scripts/refresh_authoring_snapshots.py "${args[@]}"
      - name: Snapshot diff
        if: always()
        run: git diff --stat -- tests/fixtures/corpus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-model-snapshots-${{ inputs.layout }}-${{ inputs.provider }}
          path: tests/fixtures/corpus/*/model.json
          if-no-files-found: warn
